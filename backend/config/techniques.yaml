# Technique taxonomy v1 (CLAUDE.md section 4). Keep it to these labels.
# run_eval.py (M4) writes dev_precision; experimental becomes false when dev_precision >= 0.70.
# Colours are descriptive, never truth claims.
version: 1

# A red technique proposed by the LLM with confidence below this is shown amber.
amber_below: 0.7

# Rule-based (heuristic) spans are always amber + experimental, and are dropped entirely
# at these sensitivities.
heuristics:
  drop_at: [strict]

techniques:
  - label: loaded_language
    name: Loaded language
    kind: technique
    color: red
    definition: Emotionally charged words used to sway the reader rather than inform.
    example: "The council's reckless scheme will gut our neighbourhood."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: name_calling
    name: Name-calling
    kind: technique
    color: red
    definition: Labelling a person or group to discredit them instead of addressing their argument.
    example: "Only clueless bureaucrats could support this plan."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: fear_appeal
    name: Fear appeal
    kind: technique
    color: red
    definition: Invoking threat or danger to push a conclusion or action.
    example: "If this passes, your family will not be safe in its own home."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: exaggeration_minimisation
    name: Exaggeration / minimisation
    kind: technique
    color: red
    definition: Overstating or downplaying something beyond what the evidence supports.
    example: "A few delayed trains have brought the entire country to a standstill."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: whataboutism
    name: Whataboutism
    kind: technique
    color: red
    definition: Deflecting criticism by pointing to someone else's wrongdoing instead of answering it.
    example: "Why complain about our budget overrun when the last government did worse?"
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: false_dilemma
    name: False dilemma
    kind: technique
    color: red
    definition: Presenting only two options when more exist.
    example: "Either we close the border completely or we give up our country."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: questionable_authority
    name: Questionable authority
    kind: technique
    color: red
    definition: Appealing to a vague, unnamed, irrelevant or made-up authority instead of evidence.
    example: "Experts say the new vaccine changes your DNA."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: causal_oversimplification
    name: Causal oversimplification
    kind: technique
    color: red
    definition: Blaming a single cause for a complex outcome.
    example: "Prices went up for one reason only: the new mayor."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: bandwagon
    name: Bandwagon
    kind: technique
    color: red
    definition: Using "everyone knows" or "everyone agrees" as the argument itself.
    example: "Everybody knows this policy has failed."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: doubt_casting
    name: Doubt casting
    kind: technique
    color: red
    definition: Undermining someone's credibility without giving evidence.
    example: "Can we really trust a report written by these so-called scientists?"
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: unsupported_claim
    name: Unsupported claim
    kind: claim
    color: amber
    definition: A check-worthy factual claim with no source given in the text. This does not mean it is false.
    example: "Crime in the city has doubled since last year."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: supported_claim
    name: Claim with a source
    kind: claim
    color: green
    definition: A factual claim that comes with a link, a named source or dated data in the text. This does not mean it is true.
    example: "Unemployment fell to 6.1% in October, Statistics Estonia said."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

  - label: balance
    name: Balance marker
    kind: claim
    color: blue
    definition: A fair counter-argument or an acknowledged uncertainty.
    example: "Critics argue the cost estimate is too optimistic, and the final figure is not yet known."
    enabled: true
    min_confidence: {strict: 0.8, balanced: 0.6, broad: 0.4}
    dev_precision: null
    experimental: true

# Technique taxonomy v1 (CLAUDE.md section 4). Keep it to these labels.
# run_eval.py / calibrate.py write dev_precision + dev_predictions. A technique is VALIDATED when
# dev_precision >= 0.70 on >= 15 predictions (taxonomy.validated); otherwise it is shown as
# "not yet validated" (dashed). `experimental` below mirrors that rule and is recomputed on load.
# Colours are descriptive, never truth claims.
version: 1

# Rule-based (heuristic) spans are always "not yet validated", and are dropped entirely
# at these sensitivities.
heuristics:
  drop_at: [strict]

techniques:
  - label: loaded_language
    name: Loaded language
    kind: technique
    color: red
    definition: Emotionally charged verbs, adjectives or phrasing used to provoke outrage, disgust or excitement rather than inform.
    example: "The council's reckless scheme will gut our neighbourhood."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: 0.594
    dev_predictions: 32
    experimental: true

  - label: name_calling
    name: Name-calling
    display_name: Name-calling / labelling
    kind: technique
    color: red
    definition: Attaching a derogatory, ideological or loaded noun-phrase label or epithet to a person, group, institution or policy so the reader reacts to the label instead of arguments.
    example: "Only clueless bureaucrats and corrupt elites could back this puppet regime."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: 0.75
    dev_predictions: 8
    experimental: true

  - label: fear_appeal
    name: Fear appeal
    display_name: Fear / threat appeal
    kind: technique
    color: red
    definition: Invoking danger, violence, panic, collapse or loss of safety to push a conclusion - whether conditional ("if X, then Y") or catastrophic threat framing.
    example: "Leaving families freezing in the dark while streets become unsafe to walk."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: 0.4
    dev_predictions: 5
    experimental: true

  - label: exaggeration_minimisation
    name: Exaggeration / minimisation
    kind: technique
    color: red
    definition: Overstating scale or harm beyond what evidence supports, or trivialising serious facts as nothing.
    example: "A few delayed trains have brought the entire country to a complete standstill."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: whataboutism
    name: Whataboutism
    display_name: Whataboutism / deflection
    kind: technique
    color: red
    definition: Deflecting criticism or shifting blame by pointing to someone else's wrongdoing instead of answering the point.
    example: "Why complain about our budget overrun when the previous government wasted even more?"
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: false_dilemma
    name: False dilemma
    kind: technique
    color: red
    definition: Presenting complex choices as only two extreme outcomes ("either A or B", "the only option left") when other paths exist.
    example: "Either we close the border completely or we surrender our country."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: questionable_authority
    name: Questionable authority
    display_name: Questionable / fabricated authority
    kind: technique
    color: red
    definition: Appealing to unnamed, vague, irrelevant or fabricated authorities ("experts say", "senior insiders claim", invented studies) instead of verifiable sources.
    example: "Top independent insiders confirm the new meters secretly record conversations."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: causal_oversimplification
    name: Causal oversimplification
    display_name: Causal oversimplification / scapegoating
    kind: technique
    color: red
    definition: Blaming a single cause or scapegoat for a complex outcome with multiple factors.
    example: "Prices went up for one reason only: the new mayor."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: bandwagon
    name: Bandwagon
    kind: technique
    color: red
    definition: Treating "everyone knows", "every sensible person agrees" or supposed majority belief as proof in itself.
    example: "Everybody knows this policy has failed."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: doubt_casting
    name: Doubt casting
    display_name: Doubt casting / insinuation
    kind: technique
    color: red
    definition: Undermining credibility or motives via unsubstantiated insinuation, scare quotes or leading rhetorical questions ("just asking").
    example: "Can we really trust figures written by these so-called 'independent' scientists?"
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: 0.333
    dev_predictions: 12
    experimental: true

  - label: unsupported_claim
    name: Unsupported claim
    kind: claim
    color: amber
    definition: A check-worthy factual claim with no source given in the text. This does not mean it is false.
    example: "Crime in the city has doubled since last year."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: supported_claim
    name: Claim with a source
    display_name: Cites a source (not yet verified)
    kind: claim
    color: green
    definition: A factual claim that comes with a link, a named source or dated data in the text. This does not mean it is true.
    example: "Unemployment fell to 6.1% in October, Statistics Estonia said."
    public_example: "Unemployment fell to 4.1% in October, Reuters reported."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  - label: balance
    name: Balance marker
    kind: claim
    color: blue
    definition: A fair counter-argument or an acknowledged uncertainty.
    example: "Critics argue the cost estimate is too optimistic, and the final figure is not yet known."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true

  # Added by claim verification (POST /api/verify), never proposed by the tagger (tagger: false keeps it out
  # of the tagger prompt): the text names a source, but no report from that source saying it was found.
  - label: unverifiable_attribution
    name: Unverifiable attribution
    kind: technique
    color: red
    tagger: false
    definition: The text says a named outlet reported this, but we found no report from that outlet saying it.
    example: "Emergency power rationing starts Monday, according to Reuters (when Reuters published no such report)."
    enabled: true
    min_confidence: {strict: 0.89, balanced: 0.86, broad: 0.0}
    dev_precision: null
    experimental: true
